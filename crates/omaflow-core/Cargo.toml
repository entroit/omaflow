[package]
name = "omaflow-core"
version = "0.21.5"
edition = "2024"
description = "OmaFlow's platform-independent core: configuration, the dictation state machine, history and the journal"
license = "MIT"
publish = false

[dependencies]
libc = "0.2.189"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
toml = "0.9"
toml_edit = "0.25.13"

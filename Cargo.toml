[package]
name = "omaflow"
version = "0.16.0"
edition = "2024"
description = "Fast, private local dictation for Omarchy"
license = "MIT"
repository = "https://github.com/entroit/omaflow"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.25.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
